version: "v0.4"

project:
  name: "Erdős Problem 1100: τ⊥(n) = ω(n) is attained for every number of prime factors"
  description: >-
    For a positive integer n with divisors 1 = d_1 < ... < d_τ(n) = n, let τ⊥(n)
    count the indices i with gcd(d_i, d_{i+1}) = 1, and let ω(n) be the number of
    distinct prime divisors of n. Erdős and Hall observed that τ⊥(n) = ω(n) when
    n = p_1 ⋯ p_k with each prime p_i larger than p_1 ⋯ p_{i-1}. This project proves
    in Lean 4 that for every k there is a squarefree n with ω(n) = k and τ⊥(n) = k,
    which is the statement erdos_1100.variants.eq_omega of google-deepmind/formal-conjectures.
    The proof shows that for a prime p > n the sorted divisor list of n·p is the
    divisor list of n followed by p times it, so τ⊥(n·p) = τ⊥(n) + 1.
  authors:
    - "pigeon318"
  license: "Apache-2.0"
  responsible_maintainers:
    - "pigeon318"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A25", "11A05"]

sources:
  - title: "On some unconventional problems on the divisors of integers"
    authors:
      - "P. Erdős"
      - "R. R. Hall"
    id: "J. Austral. Math. Soc. Ser. A 25 (1978), 479-485"
    type: "article"
    location: "https://www.renyi.hu/~p_erdos/1978-26.pdf"
    relationship: "formalizes"
    note: "The equality τ⊥(n) = ω(n) for n = p_1 ⋯ p_k with p_i > p_1 ⋯ p_{i-1} is noted on p. 480."
  - title: "Erdős Problem 1100"
    type: "web page"
    location: "https://www.erdosproblems.com/1100"
    relationship: "background"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/5c783f7227e86c989fd592da04915f377dc6cb23/FormalConjectures/ErdosProblems/1100.lean"
    relationship: "builds-on"
    note: "The definition tauPerp and the statement erdos_1100.variants.eq_omega are copied verbatim from this file, where the statement is left as sorry."

status:
  scope: >-
    Fully proves erdos_1100.variants.eq_omega as stated in formal-conjectures: for every k
    there is a squarefree n with ω(n) = k and τ⊥(n) = k. The other parts of Erdős Problem 1100
    (the growth of τ⊥ and of g(k)) are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

